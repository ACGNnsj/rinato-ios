name: macos-shaders

# Phase 1 (bisect half 1): download/decrypt/split only. dmsh_build rejoins once this registers.

on:
  push:
    branches: [rinato-native-m0]
    paths:
      - "docs/evidence/rinato-profile/**"
      - ".github/workflows/macos-shaders.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-shaders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shaders:
    name: split + dmsh_build on macOS
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      DM_GAMES_DIR: ${{ github.workspace }}/docs/evidence
      DM_GAME: rinato-profile

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Shallow-clone upstream toolchain
        run: git clone --depth 1 https://github.com/seedds/nxnative.git /tmp/nxnative

      - name: Install deps (venv, runner python is PEP-668 managed)
        run: |
          set -euo pipefail
          python3 -m venv /tmp/nxvenv
          /tmp/nxvenv/bin/pip install lz4 "capstone==5.*"

      - name: Download encrypted ExeFS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nso
          gh release download ci-deps-1 --repo "${{ github.repository }}" --pattern "rinato-exefs-101.enc" --dir /tmp/nso
          gh release download ci-deps-1 --repo "${{ github.repository }}" --pattern "rinato-romfs-101.tar.*.enc" --dir /tmp/romfs

      - name: Decrypt ExeFS (key from secret, shredded after use)
        run: |
          set -euo pipefail
          echo "${{ secrets.NSO_BUNDLE_KEY }}" > /tmp/nso/key.txt
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -in /tmp/nso/rinato-exefs-101.enc -out /tmp/nso/exefs.tar -pass file:/tmp/nso/key.txt
          tar -xf /tmp/nso/exefs.tar -C /tmp/nso
          shred -u /tmp/nso/key.txt || rm -f /tmp/nso/key.txt
          ls -l /tmp/nso/exefs/main

      - name: Decrypt RomFS (key from secret, shredded after use)
        run: |
          set -euo pipefail
          echo "${{ secrets.ROMFS_BUNDLE_KEY }}" > /tmp/romfs/key.txt
          cat /tmp/romfs/rinato-romfs-101.tar.*.enc > /tmp/romfs/romfs.tar.enc
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -in /tmp/romfs/romfs.tar.enc -out /tmp/romfs/romfs.tar -pass file:/tmp/romfs/key.txt
          mkdir -p /tmp/romfs101 && tar -xf /tmp/romfs/romfs.tar -C /tmp/romfs101
          shred -u /tmp/romfs/key.txt || rm -f /tmp/romfs/key.txt
          ls /tmp/romfs101/RomFS | head -5

      - name: Stage profile into clone (loaders read dm/games, not DM_GAMES_DIR)
        run: |
          set -euo pipefail
          cp -r "${{ github.workspace }}/docs/evidence/rinato-profile" /tmp/nxnative/dm/games/rinato-profile
          ls /tmp/nxnative/dm/games/rinato-profile/

      - name: "Split shaders from main (empty RomFS: main-only subset)"
        run: |
          set -euo pipefail
          mkdir -p /tmp/split/pkg /tmp/split/tables
          /tmp/nxvenv/bin/python /tmp/nxnative/dm/gfx/tools/shader_split.py /tmp/romfs101/RomFS /tmp/nso/exefs/main /tmp/split/pkg /tmp/split/tables/map.tsv /tmp/split/tables/facts.tsv /tmp/split/tables/pairs.tsv /tmp/split/tables/pso_pairs.tsv

      - name: Stage the main-only tables for dmsh_build
        run: |
          set -euo pipefail
          profile=/tmp/nxnative/dm/games/rinato-profile
          cp /tmp/split/tables/map.tsv "$profile/shader_map.tsv"
          cp /tmp/split/tables/facts.tsv "$profile/shader_facts.tsv"
          cp /tmp/split/tables/pairs.tsv "$profile/shader_pairs.tsv"
          cp /tmp/split/tables/pso_pairs.tsv "$profile/pso_pairs.tsv"
          cp /tmp/split/tables/geo_pairs.tsv "$profile/geo_pairs.tsv"
          cp /tmp/split/tables/mesh_pairs.tsv "$profile/mesh_pairs.tsv"

      - name: Verify split outputs
        run: |
          set -euo pipefail
          ls -lR /tmp/split | head -25
          wc -l /tmp/split/tables/map.tsv /tmp/split/tables/facts.tsv

      - name: Install and verify the locked Metal toolchain
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild -version
          xcrun metal --version
          python3 /tmp/nxnative/dm/gfx/tools/own_compilers.py --check-metal

      - name: dmsh_build Mac libraries
        run: |
          set -euo pipefail
          mkdir -p /tmp/shader-out
          /tmp/nxvenv/bin/python /tmp/nxnative/dm/gfx/tools/dmsh_build.py /tmp/split/pkg /tmp/shader-out

      - name: Verify shader libraries
        run: |
          set -euo pipefail
          ls -lR /tmp/shader-out | head -25

      - name: dmsh_build iOS libraries (iphoneos metallib)
        env:
          IOSOUT: /tmp/shader-ios
        run: |
          set -euo pipefail
          mkdir -p /tmp/shader-ios
          /tmp/nxvenv/bin/python /tmp/nxnative/dm/gfx/tools/dmsh_build.py /tmp/split/pkg /tmp/shader-out

      - name: Verify iOS libraries
        run: |
          set -euo pipefail
          ls -lR /tmp/shader-ios | head -30

