name: macos-shaders

# Phase 1 (bisect half 1): download/decrypt/split only. dmsh_build rejoins once this registers.

on:
  push:
    branches: [rinato-native-m0]
    paths:
      - "docs/evidence/rinato-profile/**"
      - ".github/workflows/macos-shaders.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-shaders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shaders:
    name: split + dmsh_build on macOS
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DM_GAMES_DIR: ${{ github.workspace }}/docs/evidence
      DM_GAME: rinato-profile

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Echo
        run: echo header-variant-probe

